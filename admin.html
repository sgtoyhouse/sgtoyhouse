<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SG Toy House Admin</title>

<style>

:root{
    --gold:#d4af37;
    --dark:#0b0b0b;
    --card:#1a1a1a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:var(--dark);
    color:white;
    max-width:1400px;
    margin:auto;
    padding:30px;
}

h1{
    color:var(--gold);
    margin-bottom:25px;
}

.form-section{
    background:var(--card);
    padding:25px;
    border-radius:15px;
    margin-bottom:30px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn{
    background:var(--gold);
}

.export-btn{
    background:#28a745;
    color:white;
}

.delete-btn{
    background:#dc3545;
    color:white;
}

.edit-btn{
    background:#007bff;
    color:white;
}

.product-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
}

.product-card{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-body{
    padding:15px;
}

.price{
    color:var(--gold);
    font-size:1.2rem;
    font-weight:bold;
    margin:8px 0;
}

.stock{
    color:#7de67d;
}

textarea{
    width:100%;
    min-height:300px;
    margin-top:20px;
    background:#151515;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
}

.preview{
    margin-top:15px;
    max-width:300px;
    border-radius:10px;
}

.form-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

</style>
</head>

<body>

<h1>SG Toy House Inventory Admin</h1>

<div class="form-section">

<h2>Add / Edit Product</h2>

<label>Product Name</label>
<input type="text" id="name">

<label>Price (SGD)</label>
<input type="number" id="price">

<label>Category</label>
<select id="category">

<option>LEGO</option>
<option>Pokemon</option>
<option>One Piece</option>

</select>

<label>Stock Status</label>
<select id="stock">

<option>In Stock</option>
<option>Last Few Left</option>
<option>Sold Out</option>

</select>

<label>Image URL</label>

<input
type="text"
id="image"
placeholder="assets/products/item.jpg"
oninput="previewImage()">

<img
id="preview"
class="preview"
style="display:none;">

<div class="form-buttons">

<button class="add-btn" onclick="saveProduct()">
Save Product
</button>

<button onclick="clearForm()">
Clear
</button>

</div>

</div>

<h2>Current Products</h2>

<div id="products" class="product-grid"></div>

<br>

<button
class="export-btn"
onclick="exportJSON()">

Export products.json

</button>

<textarea
id="jsonOutput"
placeholder="Exported JSON will appear here...">
</textarea>

<script>

let products = [];

let editIndex = null;

function previewImage(){

    const image =
    document.getElementById('image').value;

    const preview =
    document.getElementById('preview');

    if(image){

        preview.src = image;
        preview.style.display = 'block';

    }else{

        preview.style.display = 'none';

    }

}

function saveProduct(){

    const product = {

        id: Date.now(),

        name:
        document.getElementById('name').value,

        price:
        Number(
          document.getElementById('price').value
        ),

        category:
        document.getElementById('category').value,

        stock:
        document.getElementById('stock').value,

        image:
        document.getElementById('image').value,

        dateAdded:
        new Date()
        .toISOString()
        .split('T')[0]

    };

    if(editIndex !== null){

        product.id =
        products[editIndex].id;

        products[editIndex] =
        product;

        editIndex = null;

    }else{

        products.push(product);

    }

    renderProducts();

    clearForm();

}

function renderProducts(){

    const container =
    document.getElementById('products');

    container.innerHTML = '';

    products.forEach((product,index)=>{

        container.innerHTML += `

        <div class="product-card">

            <img
            src="${product.image}"
            onerror="this.src='assets/logo.png'">

            <div class="product-body">

                <h3>${product.name}</h3>

                <div class="price">
                    SGD ${product.price}
                </div>

                <div>
                    ${product.category}
                </div>

                <div class="stock">
                    ${product.stock}
                </div>

                <br>

                <button
                class="edit-btn"
                onclick="editProduct(${index})">

                Edit

                </button>

                <button
                class="delete-btn"
                onclick="deleteProduct(${index})">

                Delete

                </button>

            </div>

        </div>

        `;

    });

}

function editProduct(index){

    const p =
    products[index];

    document.getElementById('name').value =
    p.name;

    document.getElementById('price').value =
    p.price;

    document.getElementById('category').value =
    p.category;

    document.getElementById('stock').value =
    p.stock;

    document.getElementById('image').value =
    p.image;

    previewImage();

    editIndex = index;

}

function deleteProduct(index){

    if(confirm(
       'Delete this product?'
    )){

        products.splice(index,1);

        renderProducts();

    }

}

function clearForm(){

    document.getElementById('name').value='';
    document.getElementById('price').value='';
    document.getElementById('image').value='';

    document.getElementById('preview')
    .style.display='none';

    editIndex = null;

}

function exportJSON(){

    document.getElementById(
        'jsonOutput'
    ).value = JSON.stringify(
        products,
        null,
        2
    );

}

</script>

</body>
</html>
