<!DOCTYPE html>
<html>
<head>
    <title>SGToyHouse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
        }

        .hero {
            background: linear-gradient(45deg, #ff6a00, #1a1a1a);
            color: white;
            text-align: center;
            padding: 100px 20px;
        }

        .button {
            display: inline-block;
            background: white;
            color: black;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 15px;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 250px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
    </style>
</head>
<body>

<div class="hero">
    <h1>SGToyHouse</h1>
    <p>Singapore's Home for Toys, Trading Cards & Collectibles</p>
    <a class="button" href="https://www.carousell.sg">Shop Now</a>
</div>

<div class="categories">

    <div class="card">
        <h2>🧱 LEGO</h2>
        <p>New & retired sets</p>
    </div>

    <div class="card">
        <h2>⚡ Pokémon</h2>
        <p>Singles & sealed products</p>
    </div>

    <div class="card">
        <h2>☠️ One Piece</h2>
        <p>Booster boxes & promos</p>
    </div>

</div>

</body>
</html>
